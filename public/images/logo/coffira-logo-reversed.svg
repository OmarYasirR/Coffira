<svg viewBox="0 0 520 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wordmark { font-family: 'Georgia', 'Times New Roman', serif; font-weight: 700; }
      .tagline  { font-family: Georgia, serif; font-style: italic; }
    </style>
  </defs>

  <!-- background: matches the app's dark brown header/footer -->
  <rect width="520" height="160" fill="#2B1B12"/>

  <!-- coffee bean mark -->
  <g transform="translate(38,40)">
    <circle cx="42" cy="42" r="42" fill="#F8F1E7"/>
    <path d="M42 14
             C58 14 68 26 68 42
             C68 58 58 70 42 70
             C26 70 16 58 16 42
             C16 26 26 14 42 14 Z"
          fill="#D97A3F"/>
    <path d="M42 16
             C34 24 34 34 42 42
             C50 50 50 60 42 68"
          fill="none" stroke="#F8F1E7" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="140" y="82" class="wordmark" font-size="52" fill="#F8F1E7" letter-spacing="1">Coffira</text>
  <text x="141" y="108" class="tagline" font-size="16" fill="#C7A98A" letter-spacing="3">FRESH. PREMIUM. PERFECT.</text>
</svg>
