<svg viewBox="0 0 300 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bag { fill: #6B2C2A; }
      .bag-shade { fill: #521F1D; }
      .flap { fill: #481B19; }
      .stitch { stroke: #2E100F; stroke-width: 2; stroke-dasharray: 4 4; }
      .label { fill: #F8F1E7; stroke: #2E100F; stroke-width: 2; }
      .brand { font-family: Georgia, serif; font-size: 11px; fill: #8A6A50; letter-spacing: 2px; text-anchor: middle; }
      .name  { font-family: Georgia, serif; font-weight: 700; font-size: 17px; fill: #2B1B12; text-anchor: middle; }
      .sub   { font-family: Georgia, serif; font-size: 11px; fill: #6B5A48; text-anchor: middle; }
      .leaf  { fill: #4C7A3F; }
    </style>
  </defs>

  <rect width="300" height="430" fill="#F4EEE3"/>

  <!-- scattered tea leaves -->
  <g>
    <path class="leaf" d="M40 402 C48 398 54 402 52 410 C46 414 38 410 40 402 Z" transform="rotate(-15 46 405)"/>
    <path class="leaf" d="M60 412 C68 408 74 412 72 420 C66 424 58 420 60 412 Z" transform="rotate(20 66 415)"/>
    <path class="leaf" d="M255 405 C263 401 269 405 267 413 C261 417 253 413 255 405 Z" transform="rotate(25 261 408)"/>
    <path class="leaf" d="M232 415 C240 411 246 415 244 423 C238 427 230 423 232 415 Z" transform="rotate(-10 238 418)"/>
    <path class="leaf" d="M18 417 C26 413 32 417 30 425 C24 429 16 425 18 417 Z" transform="rotate(5 24 420)"/>
  </g>

  <!-- top folded flap -->
  <path class="flap" d="M100,55 L200,55 L212,112 L88,112 Z"/>
  <line class="stitch" x1="94" y1="84" x2="206" y2="84"/>

  <!-- bag body -->
  <path class="bag" d="M88,112
           C76,112 70,124 70,144
           L70,355
           C70,385 92,405 122,405
           L178,405
           C208,405 230,385 230,355
           L230,144
           C230,124 224,112 212,112 Z"/>

  <path class="bag-shade" d="M70,144 L88,144 L88,405 C78,400 70,382 70,355 Z"/>
  <path class="bag-shade" d="M230,144 L212,144 L212,405 C222,400 230,382 230,355 Z"/>

  <!-- label -->
  <rect class="label" x="92" y="168" width="116" height="150" rx="10"/>
  <circle cx="150" cy="192" r="12" fill="#2B1B12"/>
  <path d="M150 183 C160 187 163 195 156 201 C150 203 143 199 143 192 C143 188 146 184 150 183 Z" fill="#8FAE6B"/>
  <text x="150" y="222" class="brand">COFFIRA TEA</text>
  <text x="150" y="248" class="name">English</text>
  <text x="150" y="268" class="name">Breakfast</text>
  <text x="150" y="288" class="sub">Black Tea</text>
  <text x="150" y="304" class="sub">20 Bags · 40g</text>

  <circle cx="150" cy="400" r="6" fill="#2E100F"/>
</svg>
